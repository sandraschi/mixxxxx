# Managed by mcp-central-docs/scripts/set_fleet_dependabot.py (GITHUB_TRIAGE_STANDARD.md):
# weekly, grouped, low noise. Edit the generator, not this file.
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    groups:
      github-actions-updates:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
